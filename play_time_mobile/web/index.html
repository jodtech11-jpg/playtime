<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play Time — book sports venues, join matches, and connect with players.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Play Time">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Play Time</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JS API is loaded at runtime so the API key is never committed
    to the repo. Provide it one of two ways:
      1) Build-time substitution: replace `GOOGLE_MAPS_API_KEY` below before
         serving (e.g. with sed or a CI step).
      2) Runtime injection: set `window.GOOGLE_MAPS_API_KEY` from an inline
         script that your server renders, then reload this file.
    The key must be restricted in Google Cloud (HTTP referrer + API).
  -->
  <script src="maps_config.js"></script>
  <script>
    window.googleMapsReady = false;
    function initGoogleMaps() {
      window.googleMapsReady = true;
    }
    (function () {
      var key = window.GOOGLE_MAPS_API_KEY || 'GOOGLE_MAPS_API_KEY';
      if (!key || key === 'GOOGLE_MAPS_API_KEY') {
        console.warn('Google Maps API key is not configured for this build.');
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' +
        encodeURIComponent(key) + '&callback=initGoogleMaps';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    })();
  </script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
